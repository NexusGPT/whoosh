[package]
name = "secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keychain adapter: account-credential, provider-credential and device-link secrets live in the (iCloud) Keychain; everything else holds a KeychainRef."

[dependencies]
contracts = { workspace = true }

# security-framework (MIT OR Apache-2.0) is the open-source start for the Keychain calls.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"
