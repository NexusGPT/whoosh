[package]
name = "search-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Whoosh full-text index: tantivy over every message, fed by the store's change feed."

[dependencies]
contracts = { workspace = true }
store = { path = "../store" }
# Same SQLite pair as the store crate (rusqlite MIT, bundled SQLite public domain); this crate only reads.
rusqlite = { version = "0.41", features = ["bundled"] }
# tantivy (MIT): the full-text engine. Default features off: mmap and the pure-Rust LZ4 doc store only.
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
